services:
  postgres:
    image: postgres:16-alpine
    container_name: stokiffy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: stokiffy
      POSTGRES_PASSWORD: stokiffy_dev
      POSTGRES_DB: stokiffy_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stokiffy -d stokiffy_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
